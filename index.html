<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Dashboard</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --bg-card: #fff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #e0e0e0;
      --green: #22c55e;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      --yellow: #eab308;
      --yellow-bg: #fefce8;
      --yellow-border: #fef08a;
      --amber: #f59e0b;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;
      --gray: #9ca3af;
      --gray-bg: #f9fafb;
      --gray-border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --bg-card: #1e1e1e;
        --text: #e5e5e5;
        --text-secondary: #999;
        --border: #333;
        --green-bg: #052e16;
        --green-border: #166534;
        --red-bg: #350a0a;
        --red-border: #7f1d1d;
        --yellow-bg: #352a04;
        --yellow-border: #854d0e;
        --amber-bg: #352a04;
        --amber-border: #92400e;
        --gray-bg: #1a1a1a;
        --gray-border: #333;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .refresh-info {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
    }

    .card.pass { border-color: var(--green-border); background: var(--green-bg); }
    .card.critical { border-color: var(--red-border); background: var(--red-bg); }
    .card.fail { border-color: var(--red-border); background: var(--red-bg); }
    .card.warning { border-color: var(--yellow-border); background: var(--yellow-bg); }
    .card.minor { border-color: var(--amber-border); background: var(--amber-bg); }
    .card.retry { border-color: var(--amber-border); background: var(--amber-bg); }
    .card.stale { border-color: var(--gray-border); background: var(--gray-bg); }
    .card.unknown { border-color: var(--gray-border); background: var(--gray-bg); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-badge.pass { background: var(--green); color: #fff; }
    .status-badge.critical { background: var(--red); color: #fff; }
    .status-badge.fail { background: var(--red); color: #fff; }
    .status-badge.warning { background: var(--yellow); color: #000; }
    .status-badge.minor { background: var(--amber); color: #fff; }
    .status-badge.retry { background: var(--amber); color: #fff; }
    .status-badge.stale { background: var(--gray); color: #fff; }
    .status-badge.unknown { background: var(--gray); color: #fff; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
    }

    .stat-value.passed { color: var(--green); }
    .stat-value.failed { color: var(--red); }
    .stat-value.skipped { color: var(--yellow); }
    .stat-value.retried { color: var(--amber); }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .delta {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .delta.better { background: #dcfce7; color: #166534; }
    .delta.worse { background: #fee2e2; color: #991b1b; }
    .delta.same { background: #f3f4f6; color: #6b7280; }

    @media (prefers-color-scheme: dark) {
      .delta.better { background: #052e16; color: #4ade80; }
      .delta.worse { background: #350a0a; color: #fca5a5; }
      .delta.same { background: #1f2937; color: #9ca3af; }
    }

    .pass-rate {
      text-align: center;
      margin-bottom: 16px;
    }

    .pass-rate-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .pass-rate-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .pass-rate-fill.high { background: var(--green); }
    .pass-rate-fill.mid { background: var(--yellow); }
    .pass-rate-fill.low { background: var(--red); }

    .pass-rate-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .failed-tests {
      margin-bottom: 16px;
      padding: 10px 12px;
      background: rgba(239, 68, 68, 0.08);
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .failed-tests-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--red);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .failed-test-item {
      display: block;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      padding: 3px 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .failed-test-item:hover {
      color: var(--red);
      text-decoration: underline;
    }

    .info-table {
      width: 100%;
      margin-bottom: 16px;
      border-collapse: collapse;
    }

    .info-table tr {
      border-bottom: 1px solid var(--border);
    }

    .info-table tr:last-child {
      border-bottom: none;
    }

    .info-table td {
      padding: 8px 0;
      font-size: 13px;
      vertical-align: top;
    }

    .info-table .info-icon {
      width: 28px;
      font-size: 15px;
      opacity: 0.7;
    }

    .info-table .info-label {
      color: var(--text-secondary);
      white-space: nowrap;
      padding-right: 12px;
      font-size: 12px;
    }

    .info-table .info-value {
      text-align: right;
      font-weight: 500;
      word-break: break-word;
    }

    .info-table .info-value .ago {
      font-weight: 400;
      color: var(--text-secondary);
      font-size: 12px;
    }


    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.8; }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .error-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--red);
      font-size: 14px;
    }

    .group-title {
      font-size: 20px;
      font-weight: 600;
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .group-title:first-child {
      margin-top: 0;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 16px; }
      .stats { grid-template-columns: repeat(4, 1fr); gap: 8px; }
      .stat-value { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>QA Dashboard</h1>
    <div class="subtitle">DgtlBureau — E2E Мониторинг</div>
  </div>
  <div class="refresh-info" id="refreshInfo"></div>
  <div id="dashboard">
    <div class="loading">Загрузка...</div>
  </div>

  <script>
    const STALE_HOURS = 26;
    const REFRESH_INTERVAL = 5 * 60 * 1000;

    async function loadDashboard() {
      const dashboard = document.getElementById('dashboard');
      const refreshInfo = document.getElementById('refreshInfo');

      try {
        const res = await fetch('projects.json?' + Date.now());
        if (!res.ok) throw new Error('Не удалось загрузить projects.json');
        const projects = await res.json();

        const results = await Promise.all(projects.map(async (project) => {
          try {
            const r = await fetch(project.summaryPath + '?' + Date.now());
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            return { project, html: renderCard(project, data) };
          } catch (e) {
            return { project, html: renderCardError(project, e.message) };
          }
        }));

        // Group by group field
        const groups = new Map();
        for (const r of results) {
          const group = r.project.group || 'Other';
          if (!groups.has(group)) groups.set(group, []);
          groups.get(group).push(r.html);
        }

        let html = '';
        for (const [groupName, cards] of groups) {
          html += '<div class="group-title">' + escapeHtml(groupName) + '</div>';
          html += '<div class="grid">' + cards.join('') + '</div>';
        }
        dashboard.innerHTML = html;

        const now = new Date();
        refreshInfo.textContent = 'Обновлено: ' + now.toLocaleString('ru-RU') + ' · Авторефреш каждые 5 мин';
      } catch (e) {
        dashboard.innerHTML = '<div class="error-msg">Ошибка загрузки: ' + escapeHtml(e.message) + '</div>';
      }
    }

    function getCardStatus(data) {
      if (!data.timestamp) return 'unknown';
      const age = Date.now() - new Date(data.timestamp).getTime();
      if (age > STALE_HOURS * 60 * 60 * 1000) return 'stale';

      // Новый формат с приоритетами
      if (typeof data.failedCritical === 'number') {
        if (data.failedCritical > 0) return 'critical';
        if (data.failedMajor > 0) return 'warning';
        if (data.failedMinor > 0) return 'minor';
        if ((data.retried || 0) > 0) return 'retry';
        return 'pass';
      }

      // Старый формат (обратная совместимость)
      const failed = data.failed || 0;
      const passRate = parseFloat(data.passRate) || 0;
      if (failed > 0 && passRate < 90) return 'fail';
      if (failed > 0 && passRate >= 90) return 'warning';
      if (data.status === 'retry' || (data.retried || 0) > 0) return 'retry';
      return 'pass';
    }

    function getStatusLabel(status) {
      switch (status) {
        case 'pass': return 'Passed';
        case 'critical': return 'Critical';
        case 'fail': return 'Failed';
        case 'warning': return 'Warning';
        case 'minor': return 'Minor';
        case 'retry': return 'С retry';
        case 'stale': return 'Устарел';
        default: return 'Нет данных';
      }
    }

    function getPassRateClass(rate) {
      if (rate >= 90) return 'high';
      if (rate >= 70) return 'mid';
      return 'low';
    }

    function timeAgo(timestamp) {
      if (!timestamp) return '—';
      const diff = Date.now() - new Date(timestamp).getTime();
      const hours = Math.floor(diff / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      if (hours > 48) return Math.floor(hours / 24) + ' дн. назад';
      if (hours > 0) return hours + ' ч. ' + minutes + ' мин. назад';
      return minutes + ' мин. назад';
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return '—';
      const d = new Date(timestamp);
      return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderDelta(deltaFailed) {
      if (deltaFailed === null || deltaFailed === undefined) return '';
      if (deltaFailed > 0) return '<span class="delta worse">+' + deltaFailed + '</span>';
      if (deltaFailed < 0) return '<span class="delta better">' + deltaFailed + '</span>';
      return '<span class="delta same">=</span>';
    }

    function getPriorityIcon(priority) {
      switch (priority) {
        case 'critical': return '🔴';
        case 'major': return '🟡';
        case 'minor': return '🟠';
        default: return '❌';
      }
    }

    function renderFailedTests(failedTests, reportUrl) {
      if (!failedTests || failedTests.length === 0) return '';
      var link = (reportUrl || '#') + '#suites';
      var html = '<div class="failed-tests">' +
        '<div class="failed-tests-title">Упавшие тесты</div>';
      for (var i = 0; i < failedTests.length; i++) {
        var t = failedTests[i];
        // Поддержка обоих форматов: строка (старый) и объект с priority (новый)
        var name = typeof t === 'string' ? t : t.name;
        var icon = typeof t === 'string' ? '❌' : getPriorityIcon(t.priority);
        html += '<a class="failed-test-item" href="' + escapeHtml(link) + '" target="_blank">' + icon + ' ' + escapeHtml(name) + '</a>';
      }
      html += '</div>';
      return html;
    }

    function renderCard(project, data) {
      const status = getCardStatus(data);
      const passRate = parseFloat(data.passRate) || 0;
      const rateClass = getPassRateClass(passRate);
      const retried = data.retried || 0;

      const allureUrl = data.reportUrl || (project.summaryPath.replace('/summary.json', '/'));
      const actionsUrl = data.actionsUrl || '#';

      return '<div class="card ' + status + '">' +
        '<div class="card-header">' +
          '<div class="card-title">' + escapeHtml(data.projectDisplayName || project.name) + '</div>' +
          '<span class="status-badge ' + status + '"><span class="status-dot"></span>' + getStatusLabel(status) + '</span>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="stat-value passed">' + (data.passed || 0) + '</div><div class="stat-label">Passed</div></div>' +
          '<div class="stat"><div class="stat-value failed">' + (data.failed || 0) + renderDelta(data.deltaFailed) + '</div><div class="stat-label">Failed</div></div>' +
          '<div class="stat"><div class="stat-value skipped">' + (data.skipped || 0) + '</div><div class="stat-label">Skipped</div></div>' +
          '<div class="stat"><div class="stat-value retried">' + retried + '</div><div class="stat-label">Retry</div></div>' +
        '</div>' +
        renderFailedTests(data.failedTests, allureUrl) +
        '<div class="pass-rate">' +
          '<div class="pass-rate-bar"><div class="pass-rate-fill ' + rateClass + '" style="width:' + passRate + '%"></div></div>' +
          '<div class="pass-rate-text">Pass rate: ' + passRate + '% · Всего: ' + (data.total || 0) + '</div>' +
        '</div>' +
        '<table class="info-table">' +
          '<tr>' +
            '<td class="info-icon">&#128337;</td>' +
            '<td class="info-label">Последний прогон</td>' +
            '<td class="info-value">' + formatTimestamp(data.timestamp) + ' <span class="ago">' + timeAgo(data.timestamp) + '</span></td>' +
          '</tr>' +
          '<tr>' +
            '<td class="info-icon">&#9201;</td>' +
            '<td class="info-label">Длительность</td>' +
            '<td class="info-value">' + (data.durationFormatted || '—') + '</td>' +
          '</tr>' +
          (data.commitMessage ? '<tr>' +
            '<td class="info-icon">&#128230;</td>' +
            '<td class="info-label">Сборка</td>' +
            '<td class="info-value">' + escapeHtml(data.commitMessage) + '</td>' +
          '</tr>' : '') +
        '</table>' +
        '<div class="actions">' +
          '<a class="btn" href="' + escapeHtml(allureUrl) + '" target="_blank">Allure Report</a>' +
          '<a class="btn" href="' + escapeHtml(actionsUrl) + '" target="_blank">GitHub Actions</a>' +
        '</div>' +
      '</div>';
    }

    function renderCardError(project, error) {
      return '<div class="card unknown">' +
        '<div class="card-header">' +
          '<div class="card-title">' + escapeHtml(project.name) + '</div>' +
          '<span class="status-badge unknown"><span class="status-dot"></span>Нет данных</span>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="stat-value">—</div><div class="stat-label">Passed</div></div>' +
          '<div class="stat"><div class="stat-value">—</div><div class="stat-label">Failed</div></div>' +
          '<div class="stat"><div class="stat-value">—</div><div class="stat-label">Skipped</div></div>' +
          '<div class="stat"><div class="stat-value">—</div><div class="stat-label">Retry</div></div>' +
        '</div>' +
        '<div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:16px;">Отчёт ещё не опубликован</div>' +
        '<div class="actions">' +
          '<a class="btn" href="#" style="opacity:0.5;pointer-events:none">Allure Report</a>' +
          '<a class="btn" href="#" style="opacity:0.5;pointer-events:none">GitHub Actions</a>' +
        '</div>' +
      '</div>';
    }

    loadDashboard();
    setInterval(loadDashboard, REFRESH_INTERVAL);
  </script>
</body>
</html>
